<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BNCSSC - Post Notice</title>
  <link rel="stylesheet" href="post.css">
</head>

<body>
  <div class="header">
    <img id="logo1" src="./logo.png" alt="BNCSSC Logo">
    <h2>BNCSSC</h2>
    <p id="sentence1">Binalonan North Central School Sped Center</p>
  </div>

  <div class="menu">
    <a href="./week3.html">Home</a>
    <a href="./notices.html">All Notices</a>
    <a href="./events.html">Events</a>
    <a href="./advisories.html">Advisories</a>
    <a href="./post.html">Post Notice</a>
    <a href="./aboutUs.html">About Us</a>
  </div>

  <main>
    <section id="submit">
      <h2>POST A NOTICE</h2>
      <form action="#" method="post">
        <p>
          <label for="title">Title</label>
          <input type="text" id="title" name="title" required maxlength="100">
        </p>

        <p>
          <label for="category">Category</label>
          <select id="category" name="category">
            <option value="academic">Academic</option>
            <option value="event">Event</option>
            <option value="sports">Sports</option>
            <option value="general">General</option>
          </select>
        </p>

        <p>
          <label for="date">Date</label>
          <input type="date" id="date" name="date">
        </p>

        <p>
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="4" required></textarea>
        </p>

        <p>
          <label for="email">Your email</label>
          <input type="email" id="email" name="email" required>
        </p>

        <button type="submit">Post notice</button>
      </form>
    </section>
  </main>

  <footer>
    <p>@ BNCSSC 2026 | Binalonan North Central School Sped Center</p>
  </footer>
</body>

</html>
